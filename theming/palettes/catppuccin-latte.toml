# Catppuccin Latte — canonical values from the catppuccin project's published
# palette (https://github.com/catppuccin/palette), not algorithmically
# derived. Latte is Catppuccin's official light flavor; this mirrors
# catppuccin-mocha.toml's exact role-mapping pattern one-for-one.
name = "Catppuccin Latte"
mode = "light"

bg = "#eff1f5"
fg = "#4c4f69"
bg-alt = "#ccd0da"
hover-bg = "#bcc0cc"
hover-fg = "#4c4f69"
accent = "#1e66f5"
danger = "#d20f39"
selection = "#acb0be"

black   = "#bcc0cc"
red     = "#d20f39"
green   = "#40a02b"
yellow  = "#df8e1d"
blue    = "#1e66f5"
magenta = "#ea76cb"
cyan    = "#179299"
white   = "#5c5f77"

bright-black   = "#acb0be"
bright-red     = "#d20f39"
bright-green   = "#40a02b"
bright-yellow  = "#df8e1d"
bright-blue    = "#1e66f5"
bright-magenta = "#ea76cb"
bright-cyan    = "#179299"
bright-white   = "#6c6f85"
