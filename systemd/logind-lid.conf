# Lid close -> suspend, then hibernate after HibernateDelaySec (sleep-hibernate.conf).
# Why: the Intel AX211 wifi wedges after multi-hour s2idle (2026-11-20/21, 2026-11-23:
# "device is gone during suspend", survives reboots/poweroffs). A full hibernate
# power-off avoids long idle residency. See docs/suspend-debug-plan.md.
[Login]
HandleLidSwitch=suspend-then-hibernate
HandleLidSwitchExternalPower=suspend-then-hibernate
HandleLidSwitchDocked=ignore
